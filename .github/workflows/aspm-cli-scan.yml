name: ASPM CLI Test

on:
  pull_request:
    branches:
      - main

jobs:
  aspm-vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker build -t test-image:latest -f src/Dockerfile src/

      - name: Download AccuKnox ASPM Scanner
        run: |
          curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.8/accuknox-aspm-scanner -o accuknox-aspm-scanner
          chmod +x accuknox-aspm-scanner
          ./accuknox-aspm-scanner tool install --type container

      - name: Vuln scan - fix available (should block)
        continue-on-error: true
        run: |
          ./accuknox-aspm-scanner scan \
            --skip-upload \
            --keep-results \
            container \
            --command "image test-image:latest --severity HIGH,CRITICAL" \
            --container-mode

      - name: Print fix-available results count
        continue-on-error: true
        run: |
          cp results.json results-with-fix.json
          echo "Vuln count (fix-available scan):"
          grep -o '"VulnerabilityID"' results-with-fix.json | wc -l

      - name: Check for unfixed vulns in results
        continue-on-error: true
        run: |
          echo "Vulns WITHOUT a FixedVersion (should be excluded by --ignore-unfixed):"
          grep -B5 '"FixedVersion":""' results-with-fix.json | grep -c VulnerabilityID || echo 0

      - name: Vuln scan - no fix available (should pass)
        continue-on-error: true
        run: |
          ./accuknox-aspm-scanner scan \
            --skip-upload \
            --keep-results \
            container \
            --command "image test-image:latest --severity HIGH,CRITICAL --ignore-unfixed" \
            --container-mode

      - name: Print no-fix results count
        run: |
          cp results.json results-no-fix.json
          echo "Vuln count (ignore-unfixed scan):"
          grep -o '"VulnerabilityID"' results-no-fix.json | wc -l

  aspm-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AccuKnox ASPM Scanner
        run: |
          curl -L https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.8/accuknox-aspm-scanner -o accuknox-aspm-scanner
          chmod +x accuknox-aspm-scanner
          ./accuknox-aspm-scanner tool install --type container

      - name: Secret scan (should block)
        run: |
          ./accuknox-aspm-scanner scan \
            --skip-upload \
            secret \
            --command "filesystem ." \
            --container-mode
